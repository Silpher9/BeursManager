<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Stand Configurator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #F6F1E8; }
    #renderCanvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      outline: none;
    }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>

  <script>
    // --- Bridge (beschikbaar vóór Babylon laadt) ---
    function sendToApp(message) {
      var json = JSON.stringify(message);
      if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
        window.ReactNativeWebView.postMessage(json);
      } else {
        window.parent.postMessage(json, '*');
      }
    }

    // --- State ---
    var walls = {};       // wallId -> { mesh, config, label: null }
    var scene = null;
    var gizmoManager = null;
    var selectedWallId = null;
    var editorMode = 'build'; // 'build' | 'view'
    var guiTexture = null;

    function handleAppMessage(event) {
      var data;
      try {
        data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
      } catch (e) {
        return;
      }
      if (!data || !data.type) return;

      if (data.type === 'ping') {
        sendToApp({ type: 'pong' });
      }
      if (data.type === 'addWall' && data.wall) {
        addWall(data.wall);
      }
      if (data.type === 'removeWall' && data.wallId) {
        removeWall(data.wallId);
      }
      if (data.type === 'updateWall' && data.wallId) {
        updateWall(data.wallId, data.width, data.height, data.depth);
      }
      if (data.type === 'setRotationSnap') {
        setRotationSnap(data.enabled, data.degrees);
      }
      if (data.type === 'confirmSnap' && data.wallId) {
        confirmSnap(data.wallId, data.position, data.rotation);
      }
      if (data.type === 'dismissSnap') {
        clearGhost();
      }
      if (data.type === 'setEditorMode') {
        setEditorMode(data.mode);
      }
      if (data.type === 'setWallTransform' && data.wallId) {
        setWallTransform(data.wallId, data.position, data.rotation);
      }
      if (data.type === 'placeArtwork' && data.artworkId) {
        placeArtwork(data.artworkId, data.wallId, data.position, data.hitNormal || {x:0,y:0,z:1}, data.heightCm, data.widthCm, data.imageUri, !!data.isLocal);
      }
      if (data.type === 'removeArtwork' && data.artworkId) {
        removeArtwork(data.artworkId);
      }
      if (data.type === 'setArtworkPosition' && data.artworkId) {
        setArtworkPosition(data.artworkId, data.localPosition);
      }
      if (data.type === 'addLamp' && data.lamp) {
        addLamp(data.lamp);
      }
      if (data.type === 'removeLamp' && data.lampId) {
        removeLamp(data.lampId);
      }
      if (data.type === 'setLampPosition' && data.lampId) {
        setLampPosition(data.lampId, data.position);
      }
      if (data.type === 'setLampTarget' && data.lampId) {
        setLampTarget(data.lampId, data.target);
      }
      if (data.type === 'setLampProperty' && data.lampId) {
        setLampProperty(data.lampId, data.property, data.value);
      }
      if (data.type === 'setSceneProperty') {
        setSceneProperty(data.property, data.value);
      }
      if (data.type === 'toggleLampHelper' && data.lampId) {
        toggleLampHelper(data.lampId, data.visible);
      }
    }

    document.addEventListener('message', handleAppMessage);
    window.addEventListener('message', handleAppMessage);

    window.onerror = function (msg, url, line, col, err) {
      sendToApp({ type: 'error', message: 'JS error: ' + msg });
    };

    // --- Wall management ---
    function cmToM(cm) { return cm / 100; }

    function createWallMaterial(id) {
      var mat = new BABYLON.StandardMaterial('wallMat_' + id, scene);
      mat.diffuseColor = new BABYLON.Color3(0.95, 0.93, 0.88);
      mat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
      return mat;
    }

    function addWall(config) {
      if (walls[config.id]) return;

      var w = cmToM(config.width);
      var h = cmToM(config.height);
      var d = cmToM(config.depth);
      var mesh = BABYLON.MeshBuilder.CreateBox('wall_' + config.id, {
        width: w, height: h, depth: d
      }, scene);
      mesh.position = new BABYLON.Vector3(0, h / 2, 0);
      mesh.material = createWallMaterial(config.id);
      mesh.metadata = { wallId: config.id };

      walls[config.id] = { mesh: mesh, config: config, label: null, labelText: null };

      // Spread walls so they don't overlap
      var count = Object.keys(walls).length;
      if (count > 1) {
        mesh.position.x = (count - 1) * 2;
      }

      createLabel(config.id);
    }

    function removeWall(wallId) {
      var entry = walls[wallId];
      if (!entry) return;
      // Remove child lamps on this wall
      var lampIdsToRemove = Object.keys(placedLamps);
      for (var li = 0; li < lampIdsToRemove.length; li++) {
        if (placedLamps[lampIdsToRemove[li]].wallId === wallId) {
          removeLamp(lampIdsToRemove[li]);
        }
      }
      // Remove child artworks on this wall
      var artworkIds = Object.keys(placedArtworks);
      for (var i = 0; i < artworkIds.length; i++) {
        if (placedArtworks[artworkIds[i]].wallId === wallId) {
          removeArtwork(artworkIds[i]);
        }
      }
      removeLabel(wallId);
      if (entry.mesh.material) entry.mesh.material.dispose();
      entry.mesh.dispose();
      delete walls[wallId];
      if (selectedWallId === wallId) {
        selectedWallId = null;
        if (gizmoManager) gizmoManager.attachToMesh(null);
        sendToApp({ type: 'wallSelected', wallId: null });
      }
    }

    function updateWall(wallId, width, height, depth) {
      var entry = walls[wallId];
      if (!entry) return;

      var pos = entry.mesh.position.clone();
      var rotQ = entry.mesh.rotationQuaternion ? entry.mesh.rotationQuaternion.clone() : null;
      var rot = entry.mesh.rotation.clone();
      if (entry.mesh.material) entry.mesh.material.dispose();
      entry.mesh.dispose();

      var w = cmToM(width);
      var h = cmToM(height);
      var d = cmToM(depth);
      var mesh = BABYLON.MeshBuilder.CreateBox('wall_' + wallId, {
        width: w, height: h, depth: d
      }, scene);
      mesh.position = pos;
      mesh.position.y = h / 2;
      if (rotQ) {
        mesh.rotationQuaternion = rotQ;
      } else {
        mesh.rotation = rot;
      }
      mesh.material = createWallMaterial(wallId);
      mesh.metadata = { wallId: wallId };

      removeLabel(wallId);
      entry.mesh = mesh;
      entry.config.width = width;
      entry.config.height = height;
      entry.config.depth = depth;
      // Re-parent child artworks to new mesh
      var artworkIds = Object.keys(placedArtworks);
      for (var ai = 0; ai < artworkIds.length; ai++) {
        var artEntry = placedArtworks[artworkIds[ai]];
        if (artEntry.wallId === wallId) {
          artEntry.mesh.parent = mesh;
        }
      }
      createLabel(wallId);
      updateDistanceLabels(); // wall resize may change artwork-to-edge distances
      updateAllLampReceiversOnWall(wallId); // wall mesh rebuilt, refresh receiver refs

      if (selectedWallId === wallId && gizmoManager) {
        gizmoManager.attachToMesh(mesh);
      }
    }

    function selectWall(wallId) {
      selectedWallId = wallId;
      var entry = walls[wallId];
      if (entry && gizmoManager) {
        gizmoManager.attachToMesh(entry.mesh);
      }
      sendToApp({ type: 'wallSelected', wallId: wallId });
    }

    function deselectWall() {
      selectedWallId = null;
      if (gizmoManager) gizmoManager.attachToMesh(null);
      sendToApp({ type: 'wallSelected', wallId: null });
    }

    // --- Rotation snap ---
    function setRotationSnap(enabled, degrees) {
      if (!gizmoManager || !gizmoManager.gizmos.rotationGizmo) return;
      var rotGizmo = gizmoManager.gizmos.rotationGizmo;
      var snap = enabled ? (degrees * Math.PI / 180) : 0;
      rotGizmo.yGizmo.snapDistance = snap;
    }

    // --- Wall transform (for undo/redo) ---
    var dragStartPosition = null;
    var dragStartRotation = null;

    function getEulerRotation(mesh) {
      if (mesh.rotationQuaternion) {
        var euler = mesh.rotationQuaternion.toEulerAngles();
        return { x: euler.x, y: euler.y, z: euler.z };
      }
      return { x: mesh.rotation.x, y: mesh.rotation.y, z: mesh.rotation.z };
    }

    function setWallTransform(wallId, position, rotation) {
      var entry = walls[wallId];
      if (!entry) return;
      entry.mesh.position = new BABYLON.Vector3(position.x, position.y, position.z);
      entry.mesh.rotation = new BABYLON.Vector3(rotation.x, rotation.y, rotation.z);
      entry.mesh.rotationQuaternion = null;
      if (selectedWallId === wallId && gizmoManager) {
        gizmoManager.attachToMesh(entry.mesh);
      }
    }

    // --- Editor mode / labels ---
    function createWallLabel(text, mesh, offsetX, offsetY) {
      var rect = new BABYLON.GUI.Rectangle();
      rect.width = '70px';
      rect.height = '20px';
      rect.cornerRadius = 4;
      rect.color = 'transparent';
      rect.background = 'rgba(58, 46, 34, 0.75)';
      rect.thickness = 0;

      var tb = new BABYLON.GUI.TextBlock();
      tb.text = text;
      tb.color = '#FFFDF9';
      tb.fontSize = 11;
      tb.fontWeight = 'bold';
      rect.addControl(tb);

      guiTexture.addControl(rect);
      rect.linkWithMesh(mesh);
      rect.linkOffsetXInPixels = offsetX;
      rect.linkOffsetYInPixels = offsetY;
      return { rect: rect, textBlock: tb };
    }

    function createLabel(wallId) {
      if (!guiTexture) return;
      var entry = walls[wallId];
      if (!entry || entry.label) return;

      // Width label at bottom of wall
      var widthLabel = createWallLabel(entry.config.width + 'cm', entry.mesh, 0, 80);
      // Height labels at both sides
      var heightLabelL = createWallLabel(entry.config.height + 'cm', entry.mesh, -120, 0);
      var heightLabelR = createWallLabel(entry.config.height + 'cm', entry.mesh, 120, 0);

      entry.label = [widthLabel.rect, heightLabelL.rect, heightLabelR.rect];
      entry.labelText = widthLabel.textBlock;
      entry.heightLabelText = heightLabelL.textBlock;
      entry.heightLabelTextR = heightLabelR.textBlock;

      if (editorMode !== 'build') {
        rect.isVisible = false;
      }
    }

    function updateLabel(wallId) {
      var entry = walls[wallId];
      if (!entry || !entry.labelText) return;
      entry.labelText.text = entry.config.width + 'cm';
      if (entry.heightLabelText) entry.heightLabelText.text = entry.config.height + 'cm';
      if (entry.heightLabelTextR) entry.heightLabelTextR.text = entry.config.height + 'cm';
    }

    function removeLabel(wallId) {
      var entry = walls[wallId];
      if (!entry || !entry.label) return;
      if (Array.isArray(entry.label)) {
        for (var li = 0; li < entry.label.length; li++) {
          guiTexture.removeControl(entry.label[li]);
          entry.label[li].dispose();
        }
      } else {
        guiTexture.removeControl(entry.label);
        entry.label.dispose();
      }
      entry.label = null;
      entry.labelText = null;
      entry.heightLabelText = null;
    }

    function setEditorMode(mode) {
      editorMode = mode;
      // Update distance labels visibility
      if (mode === 'view') {
        clearDistanceLabels();
      } else {
        updateDistanceLabels();
      }
      // Enable/disable lamp drag behaviors
      var lampIds = Object.keys(placedLamps);
      for (var li = 0; li < lampIds.length; li++) {
        var lampEntry = placedLamps[lampIds[li]];
        if (lampEntry.dragBehavior) {
          lampEntry.dragBehavior.enabled = (mode === 'build');
        }
        if (lampEntry.targetDragBehavior) {
          lampEntry.targetDragBehavior.enabled = (mode === 'build');
        }
      }
      // Enable/disable artwork drag behaviors
      var artIds = Object.keys(placedArtworks);
      for (var ai = 0; ai < artIds.length; ai++) {
        var artEntry = placedArtworks[artIds[ai]];
        if (artEntry.dragBehavior) {
          artEntry.dragBehavior.enabled = (mode === 'build');
        }
      }
      var wallIds = Object.keys(walls);
      for (var i = 0; i < wallIds.length; i++) {
        var entry = walls[wallIds[i]];
        if (entry.label) {
          if (Array.isArray(entry.label)) {
            for (var lj = 0; lj < entry.label.length; lj++) {
              entry.label[lj].isVisible = (mode === 'build');
            }
          } else {
            entry.label.isVisible = (mode === 'build');
          }
        }
      }
      // In view mode: detach gizmo, disable pointer interaction
      if (mode === 'view') {
        if (gizmoManager) {
          gizmoManager.attachToMesh(null);
          gizmoManager.positionGizmoEnabled = false;
          gizmoManager.rotationGizmoEnabled = false;
        }
        clearGhost();
      } else {
        if (gizmoManager) {
          gizmoManager.positionGizmoEnabled = true;
          gizmoManager.rotationGizmoEnabled = true;
          // Re-restrict axes
          if (gizmoManager.gizmos.positionGizmo) {
            gizmoManager.gizmos.positionGizmo.yGizmo.isEnabled = false;
          }
          if (gizmoManager.gizmos.rotationGizmo) {
            gizmoManager.gizmos.rotationGizmo.xGizmo.isEnabled = false;
            gizmoManager.gizmos.rotationGizmo.zGizmo.isEnabled = false;
          }
          // Re-attach to selected wall if any
          if (selectedWallId && walls[selectedWallId]) {
            gizmoManager.attachToMesh(walls[selectedWallId].mesh);
          }
        }
      }
    }

    // --- Artwork placement ---
    var placedArtworks = {}; // artworkId -> { mesh, wallId }
    var selectedArtworkId = null;

    function placeArtwork(artworkId, wallId, position, hitNormal, heightCm, widthCm, imageUri, isLocal) {
      if (placedArtworks[artworkId]) removeArtwork(artworkId);

      var h = cmToM(heightCm);
      var w = cmToM(widthCm);
      var depth = 0.02; // 2cm

      // Black depth box (frame/sides)
      var box = BABYLON.MeshBuilder.CreateBox('artBox_' + artworkId, {
        width: w, height: h, depth: depth,
      }, scene);
      var boxMat = new BABYLON.StandardMaterial('artBoxMat_' + artworkId, scene);
      boxMat.diffuseColor = new BABYLON.Color3(0, 0, 0);
      boxMat.specularColor = new BABYLON.Color3(0, 0, 0);
      box.material = boxMat;

      // Front plane with artwork texture
      var frontPlane = BABYLON.MeshBuilder.CreatePlane('artFront_' + artworkId, {
        width: w, height: h,
        sideOrientation: BABYLON.Mesh.DOUBLESIDE,
      }, scene);
      frontPlane.position.z = depth / 2 + 0.001; // Slightly in front of box
      frontPlane.parent = box;
      frontPlane.isPickable = false; // Picks land on parent box for metadata

      var frontMat = new BABYLON.StandardMaterial('artFrontMat_' + artworkId, scene);
      frontMat.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);
      if (imageUri && typeof imageUri === 'string' && imageUri.length > 0) {
        try {
          var tex = new BABYLON.Texture(imageUri, scene);
          frontMat.diffuseTexture = tex;
        } catch (e) {
          // Texture load failed — use plain white
        }
      }
      frontMat.diffuseColor = new BABYLON.Color3(1, 1, 1);
      frontPlane.material = frontMat;

      // Use box as the root mesh
      var mesh = box;
      mesh.position = new BABYLON.Vector3(position.x, position.y, position.z);
      mesh.metadata = { artworkId: artworkId, wallId: wallId };

      // Parent to wall for relative positioning
      var wallEntry = walls[wallId];
      if (wallEntry) {
        mesh.parent = wallEntry.mesh;

        if (isLocal) {
          // Position is already wall-local (replay/undo/redo)
          mesh.position = new BABYLON.Vector3(position.x, position.y, position.z);
          // Determine flip from Z sign
          if (position.z < 0) {
            box.rotation.y = Math.PI;
          }
        } else {
          // Convert world hitPoint and hitNormal to local wall space
          var worldPos = new BABYLON.Vector3(position.x, position.y, position.z);
          var worldNorm = new BABYLON.Vector3(hitNormal.x, hitNormal.y, hitNormal.z);
          var wallWorldMatrix = wallEntry.mesh.getWorldMatrix();
          var invWorldMatrix = BABYLON.Matrix.Invert(wallWorldMatrix);
          var localPos = BABYLON.Vector3.TransformCoordinates(worldPos, invWorldMatrix);
          var localNorm = BABYLON.Vector3.TransformNormal(worldNorm, invWorldMatrix).normalize();
          var wallDepth = cmToM(wallEntry.config.depth);
          if (localNorm.z >= 0) {
            localPos.z = wallDepth / 2 + depth / 2;
          } else {
            localPos.z = -(wallDepth / 2 + depth / 2);
            box.rotation.y = Math.PI;
          }
          mesh.position = localPos;
        }
      }

      // Add drag behavior for repositioning on wall plane (local X/Y only)
      var dragBehavior = new BABYLON.PointerDragBehavior({
        dragPlaneNormal: new BABYLON.Vector3(0, 0, 1), // Local Z = wall normal
      });
      dragBehavior.useObjectOrientationForDragging = true;
      dragBehavior.moveAttached = true;
      dragBehavior.enabled = (editorMode === 'build');
      var artDragStartPos = null;
      dragBehavior.onDragStartObservable.add(function () {
        artDragStartPos = { x: mesh.position.x, y: mesh.position.y, z: mesh.position.z };
        selectArtwork(artworkId);
      });
      dragBehavior.onDragObservable.add(function () {
        updateDistanceLabels(); // live update during drag
      });
      dragBehavior.onDragEndObservable.add(function () {
        if (artDragStartPos) {
          var newPos = { x: mesh.position.x, y: mesh.position.y, z: mesh.position.z };
          // Keep Z fixed (stay on wall surface)
          mesh.position.z = artDragStartPos.z;
          newPos.z = artDragStartPos.z;
          sendToApp({
            type: 'artworkMoved',
            artworkId: artworkId,
            oldLocalPosition: artDragStartPos,
            newLocalPosition: newPos,
          });
          artDragStartPos = null;
        }
        checkArtworkOverlaps(wallId);
        updateDistanceLabels();
      });
      mesh.addBehavior(dragBehavior);

      placedArtworks[artworkId] = { mesh: mesh, wallId: wallId, dragBehavior: dragBehavior };

      // Report final local position back to app for canonical state
      sendToApp({
        type: 'artworkPlaced',
        artworkId: artworkId,
        wallId: wallId,
        localPosition: { x: mesh.position.x, y: mesh.position.y, z: mesh.position.z },
      });

      checkArtworkOverlaps(wallId);
      updateAllLampReceiversOnWall(wallId);
    }

    function removeArtwork(artworkId) {
      var entry = placedArtworks[artworkId];
      if (!entry) return;
      // Dispose child meshes (front plane) first
      var children = entry.mesh.getChildMeshes();
      for (var ci = 0; ci < children.length; ci++) {
        if (children[ci].material) {
          if (children[ci].material.diffuseTexture) children[ci].material.diffuseTexture.dispose();
          children[ci].material.dispose();
        }
        children[ci].dispose();
      }
      if (entry.mesh.material) entry.mesh.material.dispose();
      entry.mesh.dispose();
      var removedWallId = entry.wallId;
      delete placedArtworks[artworkId];
      if (selectedArtworkId === artworkId) {
        selectedArtworkId = null;
        sendToApp({ type: 'artworkSelected', artworkId: null });
        clearDistanceLabels();
      }
      checkArtworkOverlaps(removedWallId);
      updateAllLampReceiversOnWall(removedWallId);
    }

    function setArtworkPosition(artworkId, localPosition) {
      var entry = placedArtworks[artworkId];
      if (!entry) return;
      entry.mesh.position = new BABYLON.Vector3(localPosition.x, localPosition.y, localPosition.z);
      checkArtworkOverlaps(entry.wallId);
      updateDistanceLabels();
    }

    // --- Artwork overlap detection ---
    function checkArtworkOverlaps(wallId) {
      // Gather all artworks on this wall using local extents
      var artIds = Object.keys(placedArtworks);
      var wallArts = [];
      for (var i = 0; i < artIds.length; i++) {
        var entry = placedArtworks[artIds[i]];
        if (entry.wallId !== wallId) continue;
        var mesh = entry.mesh;
        // Use local bounding box extents (not world) for correct overlap in rotated walls
        var bb = mesh.getBoundingInfo().boundingBox;
        var hw = bb.extendSize.x; // half width in local space
        var hh = bb.extendSize.y; // half height in local space
        wallArts.push({
          id: artIds[i],
          cx: mesh.position.x,
          cy: mesh.position.y,
          side: mesh.position.z >= 0 ? 'front' : 'back', // partition by wall side
          hw: hw,
          hh: hh,
          entry: entry,
        });
      }

      // Check pairwise AABB overlap in local X/Y (same side only)
      var overlapping = {};
      for (var a = 0; a < wallArts.length; a++) {
        for (var b = a + 1; b < wallArts.length; b++) {
          var aa = wallArts[a];
          var bb = wallArts[b];
          if (aa.side !== bb.side) continue; // different sides don't overlap
          if (Math.abs(aa.cx - bb.cx) < (aa.hw + bb.hw) &&
              Math.abs(aa.cy - bb.cy) < (aa.hh + bb.hh)) {
            overlapping[aa.id] = true;
            overlapping[bb.id] = true;
          }
        }
      }

      // Apply visual feedback
      for (var j = 0; j < wallArts.length; j++) {
        var art = wallArts[j];
        var isOverlapping = !!overlapping[art.id];
        // Set emissive on front plane (child mesh)
        var children = art.entry.mesh.getChildMeshes();
        for (var ci = 0; ci < children.length; ci++) {
          if (children[ci].material) {
            children[ci].material.emissiveColor = isOverlapping
              ? new BABYLON.Color3(0.6, 0, 0)
              : new BABYLON.Color3(0, 0, 0);
          }
        }
        // Also tint the box itself
        if (art.entry.mesh.material) {
          art.entry.mesh.material.emissiveColor = isOverlapping
            ? new BABYLON.Color3(0.4, 0, 0)
            : new BABYLON.Color3(0, 0, 0);
        }
      }
    }

    function checkAllOverlaps() {
      var checkedWalls = {};
      var artIds = Object.keys(placedArtworks);
      for (var i = 0; i < artIds.length; i++) {
        var wId = placedArtworks[artIds[i]].wallId;
        if (!checkedWalls[wId]) {
          checkedWalls[wId] = true;
          checkArtworkOverlaps(wId);
        }
      }
    }

    // --- Artwork distance labels ---
    var distanceLabels = []; // array of GUI controls

    function clearDistanceLabels() {
      for (var i = 0; i < distanceLabels.length; i++) {
        if (guiTexture) guiTexture.removeControl(distanceLabels[i]);
        distanceLabels[i].dispose();
      }
      distanceLabels = [];
    }

    function updateDistanceLabels() {
      clearDistanceLabels();
      if (editorMode !== 'build' || !selectedArtworkId || !guiTexture) return;

      var artEntry = placedArtworks[selectedArtworkId];
      if (!artEntry) return;
      var wallEntry = walls[artEntry.wallId];
      if (!wallEntry) return;

      var mesh = artEntry.mesh;
      var bb = mesh.getBoundingInfo().boundingBox;
      var hw = bb.extendSize.x; // artwork half width
      var hh = bb.extendSize.y; // artwork half height

      // Wall local bounds (center-based)
      var wallHW = cmToM(wallEntry.config.width) / 2;
      var wallHH = cmToM(wallEntry.config.height) / 2;

      // Artwork edges in local space
      var artLeft = mesh.position.x - hw;
      var artRight = mesh.position.x + hw;
      var artBottom = mesh.position.y - hh;
      var artTop = mesh.position.y + hh;

      // Distances to wall edges
      var distLeft = artLeft - (-wallHW);
      var distRight = wallHW - artRight;
      var distBottom = artBottom - (-wallHH);
      var distTop = wallHH - artTop;

      var measurements = [
        { value: distLeft, label: 'L' },
        { value: distRight, label: 'R' },
        { value: distBottom, label: 'B' },
        { value: distTop, label: 'T' },
      ];

      for (var m = 0; m < measurements.length; m++) {
        var cm = Math.round(measurements[m].value * 100);
        var rect = new BABYLON.GUI.Rectangle('dist_' + measurements[m].label);
        rect.width = '56px';
        rect.height = '20px';
        rect.cornerRadius = 4;
        rect.color = 'transparent';
        rect.background = 'rgba(64, 156, 255, 0.8)';
        rect.thickness = 0;

        var text = new BABYLON.GUI.TextBlock();
        text.text = cm + ' cm';
        text.color = '#fff';
        text.fontSize = 10;
        text.fontWeight = 'bold';
        rect.addControl(text);

        guiTexture.addControl(rect);
        rect.linkWithMesh(mesh);

        // Position label relative to artwork
        if (measurements[m].label === 'L') {
          rect.linkOffsetXInPixels = -60;
          rect.linkOffsetYInPixels = 0;
        } else if (measurements[m].label === 'R') {
          rect.linkOffsetXInPixels = 60;
          rect.linkOffsetYInPixels = 0;
        } else if (measurements[m].label === 'B') {
          rect.linkOffsetXInPixels = 0;
          rect.linkOffsetYInPixels = 30;
        } else if (measurements[m].label === 'T') {
          rect.linkOffsetXInPixels = 0;
          rect.linkOffsetYInPixels = -30;
        }

        distanceLabels.push(rect);
      }
    }

    function selectArtwork(artworkId) {
      selectedArtworkId = artworkId;
      sendToApp({ type: 'artworkSelected', artworkId: artworkId });
      updateDistanceLabels();
    }

    // --- Lamp management (artwork-first) ---
    var placedLamps = {}; // lampId -> { mesh, light, targetMesh, wallId, dragBehavior }
    var selectedLampId = null;
    var LAMP_OFFSET_Y = 0.35; // 35cm above artwork top
    var LAMP_OFFSET_Z = 0.40; // 40cm from wall surface

    function updateLampReceivers(lampId, wallId, light) {
      if (!light) {
        var entry = placedLamps[lampId];
        if (!entry) return;
        light = entry.light;
        wallId = entry.wallId;
      }
      var receivers = [];
      // Add wall mesh
      var wallEntry = walls[wallId];
      if (wallEntry) receivers.push(wallEntry.mesh);
      // Add artwork meshes on this wall (box + front plane children)
      for (var artId in placedArtworks) {
        var art = placedArtworks[artId];
        if (art.wallId === wallId) {
          receivers.push(art.mesh);
          var children = art.mesh.getChildMeshes();
          for (var ci = 0; ci < children.length; ci++) {
            receivers.push(children[ci]);
          }
        }
      }
      light.includedOnlyMeshes = receivers;
    }

    function updateAllLampReceiversOnWall(wallId) {
      for (var lampId in placedLamps) {
        if (placedLamps[lampId].wallId === wallId) {
          updateLampReceivers(lampId, wallId, null);
        }
      }
    }

    function addLamp(lamp) {
      if (placedLamps[lamp.id]) return;

      var wallEntry = walls[lamp.wallId];
      if (!wallEntry) return;

      // Lamp mesh (small cylinder) — child of wall
      var mesh = BABYLON.MeshBuilder.CreateCylinder('lamp_' + lamp.id, {
        height: 0.06, diameter: 0.12,
      }, scene);
      mesh.parent = wallEntry.mesh;
      mesh.position = new BABYLON.Vector3(lamp.position.x, lamp.position.y, lamp.position.z);
      var lampMat = new BABYLON.StandardMaterial('lampMat_' + lamp.id, scene);
      lampMat.diffuseColor = new BABYLON.Color3(0.15, 0.15, 0.15);
      lampMat.emissiveColor = new BABYLON.Color3(1, 0.95, 0.8);
      mesh.material = lampMat;
      mesh.metadata = { lampId: lamp.id };

      // Target marker (small sphere on wall surface)
      var targetMesh = BABYLON.MeshBuilder.CreateSphere('lampTarget_' + lamp.id, {
        diameter: 0.12,
      }, scene);
      targetMesh.parent = wallEntry.mesh;
      targetMesh.position = new BABYLON.Vector3(lamp.target.x, lamp.target.y, lamp.target.z);
      var targetMat = new BABYLON.StandardMaterial('lampTargetMat_' + lamp.id, scene);
      targetMat.diffuseColor = new BABYLON.Color3(1, 0.8, 0);
      targetMat.emissiveColor = new BABYLON.Color3(1, 0.8, 0);
      targetMesh.material = targetMat;
      targetMesh.isVisible = false; // only show when lamp selected
      targetMesh.isPickable = true; // pickable even when not visible (shown on select)
      targetMesh.metadata = { lampTargetId: lamp.id };

      // Target drag behavior (2D on wall plane, local X/Y)
      var targetDrag = new BABYLON.PointerDragBehavior({
        dragPlaneNormal: new BABYLON.Vector3(0, 0, 1), // wall normal (local Z)
      });
      targetDrag.useObjectOrientationForDragging = true;
      targetDrag.moveAttached = true;
      targetDrag.enabled = (editorMode === 'build');
      var targetDragStartPos = null;
      targetDrag.onDragStartObservable.add(function () {
        targetDragStartPos = { x: targetMesh.position.x, y: targetMesh.position.y, z: targetMesh.position.z };
      });
      targetDrag.onDragObservable.add(function () {
        // Keep Z fixed on wall surface
        if (targetDragStartPos) {
          targetMesh.position.z = targetDragStartPos.z;
        }
        // Constrain to wall bounds
        var wallHW = cmToM(wallEntry.config.width) / 2;
        var wallHH = cmToM(wallEntry.config.height) / 2;
        targetMesh.position.x = Math.max(-wallHW, Math.min(wallHW, targetMesh.position.x));
        targetMesh.position.y = Math.max(-wallHH, Math.min(wallHH, targetMesh.position.y));
      });
      targetDrag.onDragEndObservable.add(function () {
        if (targetDragStartPos) {
          targetMesh.position.z = targetDragStartPos.z;
          var newTarget = { x: targetMesh.position.x, y: targetMesh.position.y, z: targetMesh.position.z };
          sendToApp({ type: 'lampTargetMoved', lampId: lamp.id, oldTarget: targetDragStartPos, newTarget: newTarget });
          targetDragStartPos = null;
        }
        rebuildLampHelper(lamp.id);
      });
      targetMesh.addBehavior(targetDrag);

      // SpotLight — world space, updated from wall-local positions
      var worldLampPos = BABYLON.Vector3.TransformCoordinates(mesh.position, wallEntry.mesh.getWorldMatrix());
      var worldTargetPos = BABYLON.Vector3.TransformCoordinates(targetMesh.position, wallEntry.mesh.getWorldMatrix());
      var direction = worldTargetPos.subtract(worldLampPos).normalize();

      var light = new BABYLON.SpotLight(
        'spotLight_' + lamp.id,
        worldLampPos,
        direction,
        Math.PI / 4,
        2,
        scene
      );
      light.intensity = 2.0;
      light.diffuse = new BABYLON.Color3(1, 0.97, 0.92);

      // Restrict light to wall + artworks on this wall only
      updateLampReceivers(lamp.id, lamp.wallId, light);

      // Rail drag for lamp (1D along wall X-axis, fixed Y and Z)
      var railDrag = new BABYLON.PointerDragBehavior({
        dragAxis: new BABYLON.Vector3(1, 0, 0), // local X only (along wall)
      });
      railDrag.useObjectOrientationForDragging = true;
      railDrag.moveAttached = true;
      railDrag.enabled = (editorMode === 'build');
      var lampDragStartPos = null;

      railDrag.onDragStartObservable.add(function () {
        lampDragStartPos = { x: mesh.position.x, y: mesh.position.y, z: mesh.position.z };
        selectLamp(lamp.id);
      });
      railDrag.onDragObservable.add(function () {
        // Constrain to wall width
        var wallHW = cmToM(wallEntry.config.width) / 2;
        mesh.position.x = Math.max(-wallHW, Math.min(wallHW, mesh.position.x));
        // Keep Y and Z fixed
        mesh.position.y = lampDragStartPos ? lampDragStartPos.y : mesh.position.y;
        mesh.position.z = lampDragStartPos ? lampDragStartPos.z : mesh.position.z;
        updateLampLight(lamp.id);
      });
      railDrag.onDragEndObservable.add(function () {
        if (lampDragStartPos) {
          var newPos = { x: mesh.position.x, y: mesh.position.y, z: mesh.position.z };
          sendToApp({ type: 'lampMoved', lampId: lamp.id, oldPosition: lampDragStartPos, newPosition: newPos });
          lampDragStartPos = null;
        }
        rebuildLampHelper(lamp.id);
      });
      mesh.addBehavior(railDrag);

      placedLamps[lamp.id] = { mesh: mesh, light: light, targetMesh: targetMesh, wallId: lamp.wallId, dragBehavior: railDrag, targetDragBehavior: targetDrag };
    }

    function updateLampLight(lampId) {
      var entry = placedLamps[lampId];
      if (!entry) return;
      var wallEntry = walls[entry.wallId];
      if (!wallEntry) return;
      var wm = wallEntry.mesh.getWorldMatrix();
      var worldLampPos = BABYLON.Vector3.TransformCoordinates(entry.mesh.position, wm);
      var worldTargetPos = BABYLON.Vector3.TransformCoordinates(entry.targetMesh.position, wm);
      entry.light.position = worldLampPos;
      entry.light.direction = worldTargetPos.subtract(worldLampPos).normalize();
    }

    function rebuildLampHelper(lampId) {
      if (lampHelpers[lampId]) {
        toggleLampHelper(lampId, false);
        toggleLampHelper(lampId, true);
      }
    }

    function removeLamp(lampId) {
      var entry = placedLamps[lampId];
      if (!entry) return;
      // Cleanup helper if exists
      if (lampHelpers[lampId]) {
        if (lampHelpers[lampId].material) lampHelpers[lampId].material.dispose();
        lampHelpers[lampId].dispose();
        delete lampHelpers[lampId];
      }
      entry.light.dispose();
      if (entry.targetMesh.material) entry.targetMesh.material.dispose();
      entry.targetMesh.dispose();
      if (entry.mesh.material) entry.mesh.material.dispose();
      entry.mesh.dispose();
      delete placedLamps[lampId];
      if (selectedLampId === lampId) {
        selectedLampId = null;
        sendToApp({ type: 'lampSelected', lampId: null });
      }
    }

    function setLampPosition(lampId, position) {
      var entry = placedLamps[lampId];
      if (!entry) return;
      entry.mesh.position = new BABYLON.Vector3(position.x, position.y, position.z);
      updateLampLight(lampId);
    }

    function setLampTarget(lampId, target) {
      var entry = placedLamps[lampId];
      if (!entry) return;
      entry.targetMesh.position = new BABYLON.Vector3(target.x, target.y, target.z);
      updateLampLight(lampId);
    }

    function selectLamp(lampId) {
      // Hide previous target
      if (selectedLampId && placedLamps[selectedLampId]) {
        placedLamps[selectedLampId].targetMesh.isVisible = false;
      }
      selectedLampId = lampId;
      // Show target for selected lamp + send runtime state
      if (lampId && placedLamps[lampId]) {
        placedLamps[lampId].targetMesh.isVisible = true;
        var light = placedLamps[lampId].light;
        sendToApp({
          type: 'lampRuntimeState',
          lampId: lampId,
          intensity: light.intensity,
          angle: light.angle,
          exponent: light.exponent,
          range: light.range,
          helperVisible: !!lampHelpers[lampId],
        });
      }
      sendToApp({ type: 'lampSelected', lampId: lampId });
    }

    // --- Dev tools: lamp property tuning ---
    var lampHelpers = {}; // lampId -> helper mesh

    function setLampProperty(lampId, property, value) {
      var entry = placedLamps[lampId];
      if (!entry || !entry.light) return;
      switch (property) {
        case 'intensity': entry.light.intensity = value; break;
        case 'angle':
          entry.light.angle = Math.max(0.1, Math.min(Math.PI - 0.1, value));
          // Recreate helper if visible to match new angle
          if (lampHelpers[lampId]) {
            toggleLampHelper(lampId, false);
            toggleLampHelper(lampId, true);
          }
          break;
        case 'innerAngle': entry.light.innerAngle = value; break;
        case 'exponent': entry.light.exponent = value; break;
        case 'range': entry.light.range = Math.max(0.5, Math.min(50, value)); break;
        case 'diffuseR': entry.light.diffuse.r = value; break;
        case 'diffuseG': entry.light.diffuse.g = value; break;
        case 'diffuseB': entry.light.diffuse.b = value; break;
      }
    }

    function setSceneProperty(property, value) {
      if (!scene) return;
      switch (property) {
        case 'ambientR': scene.ambientColor.r = value; break;
        case 'ambientG': scene.ambientColor.g = value; break;
        case 'ambientB': scene.ambientColor.b = value; break;
        case 'environmentIntensity': scene.environmentIntensity = value; break;
      }
    }

    function toggleLampHelper(lampId, visible) {
      var entry = placedLamps[lampId];
      if (!entry) return;
      if (visible) {
        if (!lampHelpers[lampId]) {
          // Create cone helper showing light direction toward target
          var targetPos = entry.targetMesh.position;
          var lampPos = entry.mesh.position;
          var dist = BABYLON.Vector3.Distance(lampPos, targetPos);
          var coneRadius = Math.tan(entry.light.angle / 2) * dist;

          var helper = BABYLON.MeshBuilder.CreateCylinder('lampHelper_' + lampId, {
            diameterTop: coneRadius * 2,
            diameterBottom: 0,
            height: dist,
          }, scene);
          var helperMat = new BABYLON.StandardMaterial('lampHelperMat_' + lampId, scene);
          helperMat.diffuseColor = new BABYLON.Color3(1, 1, 0);
          helperMat.alpha = 0.15;
          helperMat.wireframe = true;
          helper.material = helperMat;
          helper.parent = entry.mesh;
          // Position at midpoint between lamp and target (in lamp-local space)
          var dx = targetPos.x - lampPos.x;
          var dy = targetPos.y - lampPos.y;
          var dz = targetPos.z - lampPos.z;
          helper.position = new BABYLON.Vector3(dx / 2, dy / 2, dz / 2);
          // Orient toward target
          helper.lookAt(new BABYLON.Vector3(dx, dy, dz));
          helper.rotation.x += Math.PI / 2; // cylinder default is Y-up
          helper.isPickable = false;
          lampHelpers[lampId] = helper;
        }
      } else {
        if (lampHelpers[lampId]) {
          if (lampHelpers[lampId].material) lampHelpers[lampId].material.dispose();
          lampHelpers[lampId].dispose();
          delete lampHelpers[lampId];
        }
      }
    }

    // --- Wall snapping ---
    var ghostMesh = null;
    var SNAP_THRESHOLD = 0.3; // 30cm in meters
    var PERPENDICULAR_TOLERANCE = 10 * Math.PI / 180; // 10 degrees

    function getWallEdges(entry) {
      var mesh = entry.mesh;
      var w = cmToM(entry.config.width);
      var d = cmToM(entry.config.depth);
      // Wall local edges: left (-w/2, 0, 0), right (w/2, 0, 0), front (0, 0, d/2), back (0, 0, -d/2)
      var matrix = mesh.getWorldMatrix();
      var halfW = w / 2;
      var halfD = d / 2;
      var localEdges = [
        { dir: 'left', pos: new BABYLON.Vector3(-halfW, 0, 0), normal: new BABYLON.Vector3(-1, 0, 0) },
        { dir: 'right', pos: new BABYLON.Vector3(halfW, 0, 0), normal: new BABYLON.Vector3(1, 0, 0) },
        { dir: 'front', pos: new BABYLON.Vector3(0, 0, halfD), normal: new BABYLON.Vector3(0, 0, 1) },
        { dir: 'back', pos: new BABYLON.Vector3(0, 0, -halfD), normal: new BABYLON.Vector3(0, 0, -1) },
      ];
      return localEdges.map(function (e) {
        return {
          dir: e.dir,
          worldPos: BABYLON.Vector3.TransformCoordinates(e.pos, matrix),
          worldNormal: BABYLON.Vector3.TransformNormal(e.normal, matrix).normalize(),
        };
      });
    }

    function checkSnap(draggedWallId) {
      var dragged = walls[draggedWallId];
      if (!dragged) return null;

      var draggedEdges = getWallEdges(dragged);
      var candidates = [];

      var wallIds = Object.keys(walls);
      for (var i = 0; i < wallIds.length; i++) {
        var targetId = wallIds[i];
        if (targetId === draggedWallId) continue;
        var target = walls[targetId];
        var targetEdges = getWallEdges(target);

        for (var de = 0; de < draggedEdges.length; de++) {
          for (var te = 0; te < targetEdges.length; te++) {
            var dEdge = draggedEdges[de];
            var tEdge = targetEdges[te];

            // Check perpendicular: normals should be ~perpendicular (dot product ~0)
            var dot = Math.abs(BABYLON.Vector3.Dot(dEdge.worldNormal, tEdge.worldNormal));
            if (dot > Math.sin(PERPENDICULAR_TOLERANCE)) continue;

            // Check distance between edge positions (XZ plane)
            var dx = dEdge.worldPos.x - tEdge.worldPos.x;
            var dz = dEdge.worldPos.z - tEdge.worldPos.z;
            var dist = Math.sqrt(dx * dx + dz * dz);

            if (dist < SNAP_THRESHOLD) {
              var offset = tEdge.worldPos.subtract(dEdge.worldPos);
              var snapPos = dragged.mesh.position.add(offset);
              snapPos.y = dragged.mesh.position.y;

              candidates.push({
                wallId: draggedWallId,
                targetWallId: targetId,
                kind: 'edge_align_perpendicular',
                candidatePosition: { x: snapPos.x, y: snapPos.y, z: snapPos.z },
                candidateRotation: {
                  x: dragged.mesh.rotation.x,
                  y: dragged.mesh.rotation.y,
                  z: dragged.mesh.rotation.z,
                },
                dist: dist,
              });
            }
          }
        }
      }

      // Only return a suggestion when there is exactly 1 candidate
      if (candidates.length === 1) {
        return candidates[0];
      }
      return null;
    }

    function showGhost(candidate) {
      clearGhost();
      var entry = walls[candidate.wallId];
      if (!entry) return;

      var w = cmToM(entry.config.width);
      var h = cmToM(entry.config.height);
      var d = cmToM(entry.config.depth);
      ghostMesh = BABYLON.MeshBuilder.CreateBox('ghost_snap', {
        width: w, height: h, depth: d
      }, scene);
      ghostMesh.position = new BABYLON.Vector3(
        candidate.candidatePosition.x,
        candidate.candidatePosition.y,
        candidate.candidatePosition.z
      );
      ghostMesh.rotation = new BABYLON.Vector3(
        candidate.candidateRotation.x,
        candidate.candidateRotation.y,
        candidate.candidateRotation.z
      );
      var ghostMat = new BABYLON.StandardMaterial('ghostMat', scene);
      ghostMat.diffuseColor = new BABYLON.Color3(0.4, 0.7, 1.0);
      ghostMat.alpha = 0.3;
      ghostMesh.material = ghostMat;
      ghostMesh.isPickable = false;
    }

    function clearGhost() {
      if (ghostMesh) {
        if (ghostMesh.material) ghostMesh.material.dispose();
        ghostMesh.dispose();
        ghostMesh = null;
      }
    }

    function confirmSnap(wallId, position, rotation) {
      var entry = walls[wallId];
      if (!entry) return;
      entry.mesh.position = new BABYLON.Vector3(position.x, position.y, position.z);
      entry.mesh.rotation = new BABYLON.Vector3(rotation.x, rotation.y, rotation.z);
      entry.mesh.rotationQuaternion = null; // Reset quaternion so euler rotation applies
      if (selectedWallId === wallId && gizmoManager) {
        gizmoManager.attachToMesh(entry.mesh);
      }
      clearGhost();
    }

    // --- Scene init ---
    function initScene() {
      try {
        var canvas = document.getElementById('renderCanvas');
        var engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });

        scene = new BABYLON.Scene(engine);
        scene.clearColor = new BABYLON.Color4(0.965, 0.945, 0.910, 1); // #F6F1E8

        // Camera
        var camera = new BABYLON.ArcRotateCamera(
          'camera',
          -Math.PI / 4,
          Math.PI / 3,
          8,
          new BABYLON.Vector3(0, 1, 0),
          scene
        );
        camera.lowerRadiusLimit = 1.5;
        camera.upperRadiusLimit = 15;
        camera.lowerBetaLimit = 0.1;
        camera.upperBetaLimit = Math.PI / 2 - 0.05;
        camera.panningSensibility = 100;
        camera.attachControl(canvas, true);

        // Verlichting
        var hemiLight = new BABYLON.HemisphericLight(
          'hemiLight',
          new BABYLON.Vector3(0, 1, 0),
          scene
        );
        hemiLight.intensity = 0.6;
        hemiLight.diffuse = new BABYLON.Color3(1, 0.98, 0.95);

        var dirLight = new BABYLON.DirectionalLight(
          'dirLight',
          new BABYLON.Vector3(-0.5, -1, 0.5),
          scene
        );
        dirLight.intensity = 0.8;
        dirLight.diffuse = new BABYLON.Color3(1, 0.97, 0.92);

        // Ground plane (10x10m)
        var ground = BABYLON.MeshBuilder.CreateGround('ground', { width: 10, height: 10 }, scene);
        var groundMat = new BABYLON.StandardMaterial('groundMat', scene);
        groundMat.diffuseColor = new BABYLON.Color3(0.82, 0.78, 0.72);
        groundMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
        ground.material = groundMat;

        // GUI voor labels
        guiTexture = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI('UI', true, scene);

        // GizmoManager voor wand-interactie
        gizmoManager = new BABYLON.GizmoManager(scene);
        gizmoManager.positionGizmoEnabled = true;
        gizmoManager.rotationGizmoEnabled = true;
        gizmoManager.scaleGizmoEnabled = false;
        gizmoManager.boundingBoxGizmoEnabled = false;
        gizmoManager.usePointerToAttachGizmos = false;

        // Beperk positie-gizmo tot X en Z (niet Y) + XZ-plane drag
        if (gizmoManager.gizmos.positionGizmo) {
          var posGizmo = gizmoManager.gizmos.positionGizmo;
          posGizmo.yGizmo.isEnabled = false;
          posGizmo.planarGizmoEnabled = true;
          // Disable XY en YZ planes, alleen XZ (grondvlak)
          if (posGizmo.xPlaneGizmo) posGizmo.xPlaneGizmo.isEnabled = false;
          if (posGizmo.yPlaneGizmo) posGizmo.yPlaneGizmo.isEnabled = true; // yPlane = XZ plane
          if (posGizmo.zPlaneGizmo) posGizmo.zPlaneGizmo.isEnabled = false;
          // Vergroot gizmo handles voor betere touch-interactie
          posGizmo.scaleRatio = 1.5;
        }

        // Beperk rotatie-gizmo tot Y (alleen draaien rond verticale as)
        if (gizmoManager.gizmos.rotationGizmo) {
          var rotGizmo = gizmoManager.gizmos.rotationGizmo;
          rotGizmo.xGizmo.isEnabled = false;
          rotGizmo.zGizmo.isEnabled = false;
          // Vergroot rotatie ring voor betere touch-interactie
          rotGizmo.scaleRatio = 1.5;
        }

        // Track drag start + snap detectie na positie-drag
        if (posGizmo) {
          var onDragStart = function () {
            if (!selectedWallId || !walls[selectedWallId]) return;
            var m = walls[selectedWallId].mesh;
            dragStartPosition = { x: m.position.x, y: m.position.y, z: m.position.z };
            dragStartRotation = getEulerRotation(m);
          };
          var onDragEnd = function () {
            if (!selectedWallId || !walls[selectedWallId]) return;
            var m = walls[selectedWallId].mesh;
            var newPos = { x: m.position.x, y: m.position.y, z: m.position.z };
            var newRot = getEulerRotation(m);

            // Send wallMoved for undo/redo history
            if (dragStartPosition) {
              sendToApp({
                type: 'wallMoved',
                wallId: selectedWallId,
                oldPosition: dragStartPosition,
                newPosition: newPos,
                oldRotation: dragStartRotation || newRot,
                newRotation: newRot,
              });
              dragStartPosition = null;
              dragStartRotation = null;
            }

            // Snap detectie
            clearGhost();
            var candidate = checkSnap(selectedWallId);
            if (candidate) {
              showGhost(candidate);
              sendToApp({ type: 'snapSuggestion', suggestion: candidate });
            } else {
              sendToApp({ type: 'snapSuggestion', suggestion: null });
            }
          };
          posGizmo.xGizmo.dragBehavior.onDragStartObservable.add(onDragStart);
          posGizmo.zGizmo.dragBehavior.onDragStartObservable.add(onDragStart);
          posGizmo.xGizmo.dragBehavior.onDragEndObservable.add(onDragEnd);
          posGizmo.zGizmo.dragBehavior.onDragEndObservable.add(onDragEnd);
          // XZ-plane drag (yPlaneGizmo) — zelfde history + snap hooks
          if (posGizmo.yPlaneGizmo) {
            posGizmo.yPlaneGizmo.dragBehavior.onDragStartObservable.add(onDragStart);
            posGizmo.yPlaneGizmo.dragBehavior.onDragEndObservable.add(onDragEnd);
          }
        }

        // Track rotation drag for undo/redo
        if (rotGizmo) {
          rotGizmo.yGizmo.dragBehavior.onDragStartObservable.add(function () {
            if (!selectedWallId || !walls[selectedWallId]) return;
            var m = walls[selectedWallId].mesh;
            dragStartPosition = { x: m.position.x, y: m.position.y, z: m.position.z };
            dragStartRotation = getEulerRotation(m);
          });
          rotGizmo.yGizmo.dragBehavior.onDragEndObservable.add(function () {
            if (!selectedWallId || !walls[selectedWallId]) return;
            var m = walls[selectedWallId].mesh;
            var newPos = { x: m.position.x, y: m.position.y, z: m.position.z };
            var newRot = getEulerRotation(m);
            if (dragStartPosition) {
              sendToApp({
                type: 'wallMoved',
                wallId: selectedWallId,
                oldPosition: dragStartPosition,
                newPosition: newPos,
                oldRotation: dragStartRotation || newRot,
                newRotation: newRot,
              });
              dragStartPosition = null;
              dragStartRotation = null;
            }
          });
        }

        // Vergroot gizmo utility layer pointer precision voor touch
        if (gizmoManager.utilityLayer) {
          gizmoManager.utilityLayer.utilityLayerScene.pointerMovePredicate = function () { return true; };
        }

        // Klik op wand/artwork = selecteer, klik op grond/lucht = deselecteer
        scene.onPointerObservable.add(function (pointerInfo) {
          if (pointerInfo.type !== BABYLON.PointerEventTypes.POINTERTAP) return;
          if (editorMode === 'view') return;
          var pickResult = pointerInfo.pickInfo;
          if (pickResult && pickResult.hit && pickResult.pickedMesh) {
            var meta = pickResult.pickedMesh.metadata;
            // Lamp target click
            if (meta && meta.lampTargetId) {
              selectLamp(meta.lampTargetId);
              return;
            }
            // Lamp click
            if (meta && meta.lampId) {
              selectLamp(meta.lampId);
              return;
            }
            // In lamp focus mode: ignore artwork/wall clicks
            if (selectedLampId) {
              selectLamp(null); // deselect lamp on any non-lamp click
              return;
            }
            // Artwork click
            if (meta && meta.artworkId) {
              selectArtwork(meta.artworkId);
              return;
            }
            // Wall click — check for placement or selection
            if (meta && meta.wallId) {
              // Send wallTapped for potential artwork placement
              var hp = pickResult.pickedPoint;
              var hn = pickResult.getNormal ? pickResult.getNormal(true) : null; // world normal
              if (hp) {
                sendToApp({
                  type: 'wallTapped',
                  wallId: meta.wallId,
                  hitPoint: { x: hp.x, y: hp.y, z: hp.z },
                  hitNormal: hn ? { x: hn.x, y: hn.y, z: hn.z } : { x: 0, y: 0, z: 1 },
                });
              }
              selectWall(meta.wallId);
              return;
            }
          }
          deselectWall();
          if (selectedArtworkId) {
            selectedArtworkId = null;
            sendToApp({ type: 'artworkSelected', artworkId: null });
            clearDistanceLabels();
          }
          if (selectedLampId) {
            selectLamp(null);
          }
          // Lamp deselect is handled above in lamp-focus mode check
        });

        // Render loop
        engine.runRenderLoop(function () {
          // Sync lamp lights with wall transforms (lights are world-space)
          for (var lampId in placedLamps) {
            updateLampLight(lampId);
          }
          scene.render();
        });

        window.addEventListener('resize', function () {
          engine.resize();
        });

        sendToApp({ type: 'sceneReady' });
      } catch (e) {
        sendToApp({ type: 'error', message: 'Scene init mislukt: ' + (e.message || e) });
      }
    }

    function loadGui() {
      var s = document.createElement('script');
      s.src = 'https://cdn.babylonjs.com/gui/babylon.gui.min.js';
      s.onload = function () { initScene(); };
      s.onerror = function () { sendToApp({ type: 'error', message: 'BabylonJS GUI CDN laden mislukt' }); };
      document.body.appendChild(s);
    }
  </script>
  <script
    src="https://cdn.babylonjs.com/babylon.js"
    onload="loadGui()"
    onerror="sendToApp({ type: 'error', message: 'BabylonJS CDN laden mislukt' })"
  ></script>
</body>
</html>
