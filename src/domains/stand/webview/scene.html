<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Stand Configurator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #F6F1E8; }
    #renderCanvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      outline: none;
    }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>

  <script>
    // --- Bridge (beschikbaar vóór Babylon laadt) ---
    function sendToApp(message) {
      var json = JSON.stringify(message);
      if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
        window.ReactNativeWebView.postMessage(json);
      } else {
        window.parent.postMessage(json, '*');
      }
    }

    // --- State ---
    var walls = {};       // wallId -> { mesh, config }
    var scene = null;
    var gizmoManager = null;
    var selectedWallId = null;

    function handleAppMessage(event) {
      var data;
      try {
        data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
      } catch (e) {
        return;
      }
      if (!data || !data.type) return;

      if (data.type === 'ping') {
        sendToApp({ type: 'pong' });
      }
      if (data.type === 'addWall' && data.wall) {
        addWall(data.wall);
      }
      if (data.type === 'removeWall' && data.wallId) {
        removeWall(data.wallId);
      }
      if (data.type === 'updateWall' && data.wallId) {
        updateWall(data.wallId, data.width, data.height, data.depth);
      }
      if (data.type === 'setRotationSnap') {
        setRotationSnap(data.enabled, data.degrees);
      }
      if (data.type === 'confirmSnap' && data.wallId) {
        confirmSnap(data.wallId, data.position, data.rotation);
      }
      if (data.type === 'dismissSnap') {
        clearGhost();
      }
    }

    document.addEventListener('message', handleAppMessage);
    window.addEventListener('message', handleAppMessage);

    window.onerror = function (msg, url, line, col, err) {
      sendToApp({ type: 'error', message: 'JS error: ' + msg });
    };

    // --- Wall management ---
    function cmToM(cm) { return cm / 100; }

    function createWallMaterial(id) {
      var mat = new BABYLON.StandardMaterial('wallMat_' + id, scene);
      mat.diffuseColor = new BABYLON.Color3(0.95, 0.93, 0.88);
      mat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
      return mat;
    }

    function addWall(config) {
      if (walls[config.id]) return;

      var w = cmToM(config.width);
      var h = cmToM(config.height);
      var d = cmToM(config.depth);
      var mesh = BABYLON.MeshBuilder.CreateBox('wall_' + config.id, {
        width: w, height: h, depth: d
      }, scene);
      mesh.position = new BABYLON.Vector3(0, h / 2, 0);
      mesh.material = createWallMaterial(config.id);
      mesh.metadata = { wallId: config.id };

      walls[config.id] = { mesh: mesh, config: config };

      // Spread walls so they don't overlap
      var count = Object.keys(walls).length;
      if (count > 1) {
        mesh.position.x = (count - 1) * 2;
      }
    }

    function removeWall(wallId) {
      var entry = walls[wallId];
      if (!entry) return;
      if (entry.mesh.material) entry.mesh.material.dispose();
      entry.mesh.dispose();
      delete walls[wallId];
      if (selectedWallId === wallId) {
        selectedWallId = null;
        if (gizmoManager) gizmoManager.attachToMesh(null);
        sendToApp({ type: 'wallSelected', wallId: null });
      }
    }

    function updateWall(wallId, width, height, depth) {
      var entry = walls[wallId];
      if (!entry) return;

      var pos = entry.mesh.position.clone();
      var rotQ = entry.mesh.rotationQuaternion ? entry.mesh.rotationQuaternion.clone() : null;
      var rot = entry.mesh.rotation.clone();
      if (entry.mesh.material) entry.mesh.material.dispose();
      entry.mesh.dispose();

      var w = cmToM(width);
      var h = cmToM(height);
      var d = cmToM(depth);
      var mesh = BABYLON.MeshBuilder.CreateBox('wall_' + wallId, {
        width: w, height: h, depth: d
      }, scene);
      mesh.position = pos;
      mesh.position.y = h / 2;
      if (rotQ) {
        mesh.rotationQuaternion = rotQ;
      } else {
        mesh.rotation = rot;
      }
      mesh.material = createWallMaterial(wallId);
      mesh.metadata = { wallId: wallId };

      entry.mesh = mesh;
      entry.config.width = width;
      entry.config.height = height;
      entry.config.depth = depth;

      if (selectedWallId === wallId && gizmoManager) {
        gizmoManager.attachToMesh(mesh);
      }
    }

    function selectWall(wallId) {
      selectedWallId = wallId;
      var entry = walls[wallId];
      if (entry && gizmoManager) {
        gizmoManager.attachToMesh(entry.mesh);
      }
      sendToApp({ type: 'wallSelected', wallId: wallId });
    }

    function deselectWall() {
      selectedWallId = null;
      if (gizmoManager) gizmoManager.attachToMesh(null);
      sendToApp({ type: 'wallSelected', wallId: null });
    }

    // --- Rotation snap ---
    function setRotationSnap(enabled, degrees) {
      if (!gizmoManager || !gizmoManager.gizmos.rotationGizmo) return;
      var rotGizmo = gizmoManager.gizmos.rotationGizmo;
      var snap = enabled ? (degrees * Math.PI / 180) : 0;
      rotGizmo.yGizmo.snapDistance = snap;
    }

    // --- Wall snapping ---
    var ghostMesh = null;
    var SNAP_THRESHOLD = 0.3; // 30cm in meters
    var PERPENDICULAR_TOLERANCE = 10 * Math.PI / 180; // 10 degrees

    function getWallEdges(entry) {
      var mesh = entry.mesh;
      var w = cmToM(entry.config.width);
      var d = cmToM(entry.config.depth);
      // Wall local edges: left (-w/2, 0, 0), right (w/2, 0, 0), front (0, 0, d/2), back (0, 0, -d/2)
      var matrix = mesh.getWorldMatrix();
      var halfW = w / 2;
      var halfD = d / 2;
      var localEdges = [
        { dir: 'left', pos: new BABYLON.Vector3(-halfW, 0, 0), normal: new BABYLON.Vector3(-1, 0, 0) },
        { dir: 'right', pos: new BABYLON.Vector3(halfW, 0, 0), normal: new BABYLON.Vector3(1, 0, 0) },
        { dir: 'front', pos: new BABYLON.Vector3(0, 0, halfD), normal: new BABYLON.Vector3(0, 0, 1) },
        { dir: 'back', pos: new BABYLON.Vector3(0, 0, -halfD), normal: new BABYLON.Vector3(0, 0, -1) },
      ];
      return localEdges.map(function (e) {
        return {
          dir: e.dir,
          worldPos: BABYLON.Vector3.TransformCoordinates(e.pos, matrix),
          worldNormal: BABYLON.Vector3.TransformNormal(e.normal, matrix).normalize(),
        };
      });
    }

    function checkSnap(draggedWallId) {
      var dragged = walls[draggedWallId];
      if (!dragged) return null;

      var draggedEdges = getWallEdges(dragged);
      var candidates = [];

      var wallIds = Object.keys(walls);
      for (var i = 0; i < wallIds.length; i++) {
        var targetId = wallIds[i];
        if (targetId === draggedWallId) continue;
        var target = walls[targetId];
        var targetEdges = getWallEdges(target);

        for (var de = 0; de < draggedEdges.length; de++) {
          for (var te = 0; te < targetEdges.length; te++) {
            var dEdge = draggedEdges[de];
            var tEdge = targetEdges[te];

            // Check perpendicular: normals should be ~perpendicular (dot product ~0)
            var dot = Math.abs(BABYLON.Vector3.Dot(dEdge.worldNormal, tEdge.worldNormal));
            if (dot > Math.sin(PERPENDICULAR_TOLERANCE)) continue;

            // Check distance between edge positions (XZ plane)
            var dx = dEdge.worldPos.x - tEdge.worldPos.x;
            var dz = dEdge.worldPos.z - tEdge.worldPos.z;
            var dist = Math.sqrt(dx * dx + dz * dz);

            if (dist < SNAP_THRESHOLD) {
              var offset = tEdge.worldPos.subtract(dEdge.worldPos);
              var snapPos = dragged.mesh.position.add(offset);
              snapPos.y = dragged.mesh.position.y;

              candidates.push({
                wallId: draggedWallId,
                targetWallId: targetId,
                kind: 'edge_align_perpendicular',
                candidatePosition: { x: snapPos.x, y: snapPos.y, z: snapPos.z },
                candidateRotation: {
                  x: dragged.mesh.rotation.x,
                  y: dragged.mesh.rotation.y,
                  z: dragged.mesh.rotation.z,
                },
                dist: dist,
              });
            }
          }
        }
      }

      // Only return a suggestion when there is exactly 1 candidate
      if (candidates.length === 1) {
        return candidates[0];
      }
      return null;
    }

    function showGhost(candidate) {
      clearGhost();
      var entry = walls[candidate.wallId];
      if (!entry) return;

      var w = cmToM(entry.config.width);
      var h = cmToM(entry.config.height);
      var d = cmToM(entry.config.depth);
      ghostMesh = BABYLON.MeshBuilder.CreateBox('ghost_snap', {
        width: w, height: h, depth: d
      }, scene);
      ghostMesh.position = new BABYLON.Vector3(
        candidate.candidatePosition.x,
        candidate.candidatePosition.y,
        candidate.candidatePosition.z
      );
      ghostMesh.rotation = new BABYLON.Vector3(
        candidate.candidateRotation.x,
        candidate.candidateRotation.y,
        candidate.candidateRotation.z
      );
      var ghostMat = new BABYLON.StandardMaterial('ghostMat', scene);
      ghostMat.diffuseColor = new BABYLON.Color3(0.4, 0.7, 1.0);
      ghostMat.alpha = 0.3;
      ghostMesh.material = ghostMat;
      ghostMesh.isPickable = false;
    }

    function clearGhost() {
      if (ghostMesh) {
        if (ghostMesh.material) ghostMesh.material.dispose();
        ghostMesh.dispose();
        ghostMesh = null;
      }
    }

    function confirmSnap(wallId, position, rotation) {
      var entry = walls[wallId];
      if (!entry) return;
      entry.mesh.position = new BABYLON.Vector3(position.x, position.y, position.z);
      entry.mesh.rotation = new BABYLON.Vector3(rotation.x, rotation.y, rotation.z);
      entry.mesh.rotationQuaternion = null; // Reset quaternion so euler rotation applies
      if (selectedWallId === wallId && gizmoManager) {
        gizmoManager.attachToMesh(entry.mesh);
      }
      clearGhost();
    }

    // --- Scene init ---
    function initScene() {
      try {
        var canvas = document.getElementById('renderCanvas');
        var engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });

        scene = new BABYLON.Scene(engine);
        scene.clearColor = new BABYLON.Color4(0.965, 0.945, 0.910, 1); // #F6F1E8

        // Camera
        var camera = new BABYLON.ArcRotateCamera(
          'camera',
          -Math.PI / 4,
          Math.PI / 3,
          8,
          new BABYLON.Vector3(0, 1, 0),
          scene
        );
        camera.lowerRadiusLimit = 1.5;
        camera.upperRadiusLimit = 15;
        camera.lowerBetaLimit = 0.1;
        camera.upperBetaLimit = Math.PI / 2 - 0.05;
        camera.panningSensibility = 100;
        camera.attachControl(canvas, true);

        // Verlichting
        var hemiLight = new BABYLON.HemisphericLight(
          'hemiLight',
          new BABYLON.Vector3(0, 1, 0),
          scene
        );
        hemiLight.intensity = 0.6;
        hemiLight.diffuse = new BABYLON.Color3(1, 0.98, 0.95);

        var dirLight = new BABYLON.DirectionalLight(
          'dirLight',
          new BABYLON.Vector3(-0.5, -1, 0.5),
          scene
        );
        dirLight.intensity = 0.8;
        dirLight.diffuse = new BABYLON.Color3(1, 0.97, 0.92);

        // Ground plane (10x10m)
        var ground = BABYLON.MeshBuilder.CreateGround('ground', { width: 10, height: 10 }, scene);
        var groundMat = new BABYLON.StandardMaterial('groundMat', scene);
        groundMat.diffuseColor = new BABYLON.Color3(0.82, 0.78, 0.72);
        groundMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
        ground.material = groundMat;

        // GizmoManager voor wand-interactie
        gizmoManager = new BABYLON.GizmoManager(scene);
        gizmoManager.positionGizmoEnabled = true;
        gizmoManager.rotationGizmoEnabled = true;
        gizmoManager.scaleGizmoEnabled = false;
        gizmoManager.boundingBoxGizmoEnabled = false;
        gizmoManager.usePointerToAttachGizmos = false;

        // Beperk positie-gizmo tot X en Z (niet Y)
        if (gizmoManager.gizmos.positionGizmo) {
          var posGizmo = gizmoManager.gizmos.positionGizmo;
          posGizmo.yGizmo.isEnabled = false;
          // Vergroot gizmo handles voor betere touch-interactie
          posGizmo.scaleRatio = 1.5;
        }

        // Beperk rotatie-gizmo tot Y (alleen draaien rond verticale as)
        if (gizmoManager.gizmos.rotationGizmo) {
          var rotGizmo = gizmoManager.gizmos.rotationGizmo;
          rotGizmo.xGizmo.isEnabled = false;
          rotGizmo.zGizmo.isEnabled = false;
          // Vergroot rotatie ring voor betere touch-interactie
          rotGizmo.scaleRatio = 1.5;
        }

        // Snap detectie na positie-drag
        if (posGizmo) {
          var onDragEnd = function () {
            if (!selectedWallId) return;
            clearGhost();
            var candidate = checkSnap(selectedWallId);
            if (candidate) {
              showGhost(candidate);
              sendToApp({ type: 'snapSuggestion', suggestion: candidate });
            } else {
              sendToApp({ type: 'snapSuggestion', suggestion: null });
            }
          };
          posGizmo.xGizmo.dragBehavior.onDragEndObservable.add(onDragEnd);
          posGizmo.zGizmo.dragBehavior.onDragEndObservable.add(onDragEnd);
        }

        // Vergroot gizmo utility layer pointer precision voor touch
        if (gizmoManager.utilityLayer) {
          gizmoManager.utilityLayer.utilityLayerScene.pointerMovePredicate = function () { return true; };
        }

        // Klik op wand = selecteer, klik op grond/lucht = deselecteer
        scene.onPointerObservable.add(function (pointerInfo) {
          if (pointerInfo.type !== BABYLON.PointerEventTypes.POINTERTAP) return;
          var pickResult = pointerInfo.pickInfo;
          if (pickResult && pickResult.hit && pickResult.pickedMesh) {
            var meta = pickResult.pickedMesh.metadata;
            if (meta && meta.wallId) {
              selectWall(meta.wallId);
              return;
            }
          }
          deselectWall();
        });

        // Render loop
        engine.runRenderLoop(function () {
          scene.render();
        });

        window.addEventListener('resize', function () {
          engine.resize();
        });

        sendToApp({ type: 'sceneReady' });
      } catch (e) {
        sendToApp({ type: 'error', message: 'Scene init mislukt: ' + (e.message || e) });
      }
    }
  </script>
  <script
    src="https://cdn.babylonjs.com/babylon.js"
    onload="initScene()"
    onerror="sendToApp({ type: 'error', message: 'BabylonJS CDN laden mislukt' })"
  ></script>
</body>
</html>
